<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p>Descubre el mundo</p>
    <h1>Lugares que debes <em>visitar</em></h1>
  </header>
   <div class="grid">

    <div class="card">
      <img src="https://cuscoperu.b-cdn.net/wp-content/uploads/2024/06/Llama-en-Machu-Picchu-pc.jpg.webp" alt="Machu Picchu"/>
      <div class="card-body">
        <div class="card-country">Peru</div>
        <div class="card-title">Machu Picchu</div>
        <div class="card-desc">Ciudad inca perdida en las montañas de los Andes, una de las maravillas del mundo moderno.</div>
      </div>
    </div>

    <div class="card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/47/New_york_times_square-terabass.jpg/1280px-New_york_times_square-terabass.jpg" alt="Nueva York"/>
      <div class="card-body">
        <div class="card-country">Estados Unidos</div>
        <div class="card-title">Nueva York</div>
        <div class="card-desc">La ciudad que nunca duerme, hogar de Times Square, Central Park y la Estatua de la Libertad.</div>
      </div>
    </div>
    
</body>
</html>
